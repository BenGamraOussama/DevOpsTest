services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: studentdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example}
    # Ne pas exposer le port 3306 sur l'hôte pour éviter les conflits sur les agents CI
    # L'application y accède via le réseau interne Compose (hôte "mysql", port 3306)
    volumes:
      - mysql_data:/var/lib/mysql

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  mysql_data:
