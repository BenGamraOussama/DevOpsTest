services:
  spring-app:
    # Image de l'application à utiliser (par défaut l'image distante demandée)
    image: ${DEPLOY_IMAGE:-oussamabengamra/student-app:latest}
    container_name: spring-app
    ports:
      - "8089:8089"
    environment:
      # Redéfinir la datasource pour pointer vers le service MySQL du compose
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studentdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example}
      JAVA_OPTS: "-Djava.security.egd=file:/dev/./urandom"
    depends_on:
      - mysql
    restart: on-failure

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: studentdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example}
    # Ne pas exposer le port 3306 sur l'hôte pour éviter les conflits sur les agents CI
    # L'application y accède via le réseau interne Compose (hôte "mysql", port 3306)
    volumes:
      - mysql_data:/var/lib/mysql

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  mysql_data:
