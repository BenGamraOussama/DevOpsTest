services:
  spring-app:
    build: .
    container_name: spring-app
    # Use host networking so that "localhost" inside the container resolves to the host machine
    # This allows the app to connect to a MySQL instance running on the host at localhost:3306
    network_mode: host
    environment:
      # Keep app defaults from application.properties (localhost DB, root user, empty password)
      # Do not override datasource settings here so it uses localhost
      JAVA_OPTS: "-Djava.security.egd=file:/dev/./urandom"
    restart: on-failure

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
