apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-sa
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-ci-cd-role
rules:
  # Permissions cluster-wide (lecture seule)
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  # Permissions pour les déploiements (par namespace)
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
    resources: ["pods", "services", "deployments", "statefulsets", "daemonsets", "jobs", "configmaps", "secrets", "persistentvolumeclaims", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-ci-cd-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-sa
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-ci-cd-role
  apiGroup: rbac.authorization.k8s.io